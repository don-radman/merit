# Cargo workspace for the Soroban contracts.
#
# DO NOT hand-write the member crate's Cargo.toml — run:
#
#     cd contracts && stellar contract init introducer-rails
#
# which scaffolds a crate with a correct, current soroban-sdk version, then add
# it to `members` below. Guessing SDK versions by hand wastes more time than the
# scaffold takes.

[workspace]
resolver = "2"
members = [
  # "introducer-rails",
]

# Standard Soroban release profile: small wasm, no panic machinery, but keep
# overflow checks on — this contract does money arithmetic.
[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
